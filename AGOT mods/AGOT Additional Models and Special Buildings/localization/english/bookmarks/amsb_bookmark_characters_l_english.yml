l_english:
 bookmark_7899_aenar_targaryen:0 "King Aenar"
 bookmark_7899_aenar_targaryen_desc:0 "Twelve years before the Doom of Valyria, Aenar's daughter, Daenys the Dreamer, foretold the destruction of Valyria. In response to this, Aenar sold his holdings in the Valyrian Freehold and the Lands of the Long Summer, and moved with his family and dragons to Dragonstone, the westernmost outpost of the Valyrian Freehold. The Targaryens were far from the most powerful of the dragonlords, and their rivals in Valyria saw their flight as an act of cowardice. However, because Aenar had moved his family away from Valyria, the Targaryens were the strongest of the dragonlords to survive the Doom"
 bookmark_10_aegon_targaryen:0 "King Aegon I"
 bookmark_10_aegon_targaryen_desc:0 "Aegon ‘the Dragon’ has ruled his newly conquered kingdom for nearly ten years, with only Dorne left to challenge his supremacy over the continent south of the Wall. But war against the Dornish rebels lingers on the horizon, as Aegon’s beloved sister-wife and queen Rhaenys perished upon her dragon Meraxes in an attempt at bringing the unbowed to heel. The king’s remaining sister-wife Visenya grieves with him, devising ways to keep the House of the Dragon safe from would-be assassins lurking behind every door."
 bookmark_42_maegor_targaryen:0 "King Maegor I"
 bookmark_42_maegor_targaryen_desc:0 "Aenys I is dead, against all traditions of inheritence Maegor Targaryen has returned and crowned himself king at Dragonstone with his father, Aegon I's crown. Soon after he flew upon the Black Dread to Kings Landing to take his seat upon the iron throne and demand his newphew come before him to swear fealty."
 bookmark_129_aegon_targaryen:0 "King Aegon II"
 bookmark_129_aegon_targaryen_desc:0 "Aegon Targaryen, the Second of His Name, claimed the Iron Throne following the death of his father Viserys I. Though his half-sister Rhaenyra was the chosen heir of their father and the Princess of Dragonstone, Aegon took hold of King’s Landing and the realm all the same."
 bookmark_153_aegon_targaryen:0 "King Aegon III"
 bookmark_153_aegon_targaryen_desc:0 "For twenty-two years, Aegon ‘the Unlucky’ has reigned from atop the Iron Throne. He has no shortage of heirs, with two sons — Daeron and Baelor — being reared at court, and two nephews through his brother Viserys. Despite the certainty of his succession, the safety of his House is in constant question."
 bookmark_178_aegon_targaryen:0 "King Aegon IV"
 bookmark_178_aegon_targaryen_desc:0 "Aegon Targaryen, the Fourth of His Name, has reigned for only six years, but in that time he has proven himself a decadent, degenerate, and corrupt ruler with little regard for affairs of state. Between strife with his eldest son — and sole trueborn heir — Daeron, mutual hatred with his well-loved brother Aemon ‘the Dragonknight,’ and fraught relationship with his sister-wife Naerys, Aegon has proven himself a weak-willed king ruled more by his own pleasures than any duty to the realm."
 bookmark_190_daemon_blackfyre:0 "Daemon Blackfyre"
 bookmark_190_daemon_blackfyre_desc:0 "Having been legitimized by his father on his deathbed Daemon Blackfyre has settled upon the blackwater rush. Behind closed doors scheming to put the charismatic Daemon upon the throne in his older brother's place has begun, the realm whispering that he was the true heir while his brother was a bastard born false king."