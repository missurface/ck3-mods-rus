l_english:
 amsb_dragonpit.0001:0 "The Dragonpit Constructed"
 amsb_dragonpit.0001.t:0 "The Dragonpit Constructed"
 amsb_dragonpit.0001.desc:0 "The Dragonpit has been constructed from the framework of the former Sept of Remembrance. The former center of worship in the city now stands ready to house the dragons of the realm. The arrival of dragons has heralded a renewed need for the pit to serve as the home to the beasts, far away from the peasantry of the city.\n\nAs apprehensive as lords and smallfolk alike are to the dragons, few are opposed to the construction of the Dragonpit, which now stands as a glorious monument to the power of the throne."
 amsb_dragonpit.0001.a:0 "It is truly glorious"

 amsb_valyrian_steel.1000.t:0 "Recover the Varezys Dynasty Artifacts"
 amsb_valyrian_steel.1000.desc_gen:0 "It has been ages since [aurion.GetFullName] lost Stormbringer during his attempt to conquer the ruined Valyria. House [ROOT.Char.GetDynasty.GetBaseName] has been without a Valyrian steel blade ever since.\n\nPerhaps it is time to attempt to recover the blade? There are few problems that gold cannot solve. With enough money—and daring adventurers—Stormbringer could be recovered.\n\n[explorer.GetFirstName], a local captain, has offered to lead the expedition.\n\nThe trip will be both expensive and dangerous... but the rewards could be impressive."
 amsb_valyrian_steel.1000.a:0 "Return safely, [explorer.GetName]"
 amsb_valyrian_steel.1000.a.tt:0 "[explorer.GetFirstName] will travel to Valyria and attempt to retrieve Stormbringer"
 amsb_valyrian_steel.1000.b:0 "Perhaps now is not the time for a quest to Valyria..."
 amsb_valyrian_steel.1000.b.tt:0 "You will cancel the expedition and your gold will be refunded"

 amsb_valyrian_steel.1002.t:0 "Recover the Varezys Dynasty Artifacts"
 amsb_valyrian_steel.1002.desc:0 "Word of [explorer.GetFirstNamePossessive] return has worked its way to me. I rush down to the docks and see that the crew is already unloading chests full of gold and other spoils from Old Valyria.\n\n[explorer.GetFirstName] approaches me with a large greatsword in hand. [explorer.GetSheHe|U] bows and presents it to me. "Stormbringer, my [ROOT.Char.GetLadyLord]. We found the wreck of [aurion.GetFirstNamePossessive] ship deep in the Smoking Sea... It is past time that the sword returns to House [ROOT.Char.GetDynasty.GetBaseName]."\n\nI take the sword into my hands. Stormbringer has finally returned home."
 amsb_valyrian_steel.1002.a:0 "[ROOT.Char.GetHouse.GetMotto]!"

 amsb_valyrian_steel.1003.t:0 "Recover the Varezys Dynasty Artifacts"
 amsb_valyrian_steel.1003.desc:0 "[explorer.GetFirstNamePossessive] expedition is long overdue. They were scheduled to have returned by now.\n\nI fear that something has gone terribly wrong in the Smoking Sea..."
 amsb_valyrian_steel.1003.a:0 "Valyria has claimed another life..."

 amsb_valyrian_steel.2000.t:0 "Stormbringer's Pommel"
 amsb_valyrian_steel.2000_desc:0 "It is time for Stormbringer to be adorned with a new jeweled pommel, one crafted in the same color as my house banner to forever symbolize the claim that myself and my descendants will hold over this blade."
 amsb_valyrian_steel.2001_desc:0 "Once more Stormbringer will be adorned with the red pommel that it was originally forged with."
 amsb_valyrian_steel.2000.a:0 "Let it be done..."
