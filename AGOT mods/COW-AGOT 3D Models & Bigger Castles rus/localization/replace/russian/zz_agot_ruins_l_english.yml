l_russian:
 reconstruct_small_ruin_tooltip:0 "Чтобы начать восстановление, у вас должно быть не менее [Select_CString(GetPlayer.HasTreasury, '@treasury_icon!', '@gold_icon!')]#high 200#!. Кроме того, ваши земли должны граничить с руинами, ваш лагерь авантюриста должен находиться в разрушенном баронстве либо вы должны быть его де-юре сюзереном."
