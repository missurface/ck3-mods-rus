l_russian:

  lv_colonisation_events.0001.t:0 "Воры в чащобе"
  lv_colonisation_events.0001.desc:0 "Ваш отряд продвигается всё глубже в дикую местность, как вдруг вас останавливают. Из-за деревьев выходит суровый мужчина с натянутым луком и разбойничьей ухмылкой на лице. «Имя мне Робин, — говорит он, — и эта земля должна мне пошлину». Рядом с ним стоит молчаливый громила — его спутник Джон. Напряжение трещит, как костёр в бурную ночь."
  
  lv_colonisation_events.0001.a:0 "Перехитрить Робина умными доводами."
  lv_colonisation_events.0001.b:0 "Договориться о безопасном проходе, используя припасы и логистику."
  lv_colonisation_events.0001.c:0 "Убедить Джона присоединиться к вам и бросить Робина."
  lv_colonisation_events.0001.d:0 "Выступить против Робина и прогнать его силой."
  lv_colonisation_events.0001.e:0 "Запугать их, заставив отступить."
  lv_colonisation_events.0001.f:0 "Вызвать Робина на поединок за главенство."
  lv_colonisation_events.0001.z:0 "Предложить взятку и надеяться, что они её примут..."

  lv_colonisation_events.0001.a.success:0 "Вы перехитрили Робина, оставив его без слов."
  lv_colonisation_events.0001.a.failure:0 "Ваша логика не смогла убедить разбойника."
  lv_colonisation_events.0001.b.success:0 "Ваше предложение припасов впечатляет их, и они отступают."
  lv_colonisation_events.0001.b.failure:0 "Робин смеётся над вашим предложением и подходит ближе."
  lv_colonisation_events.0001.c.success:0 "Джон медленно кивает и переходит на вашу сторону."
  lv_colonisation_events.0001.c.failure:0 "Джон колеблется, затем опускает глаза. «Прости»."
  lv_colonisation_events.0001.d.success:0 "Ваш властный вид заставляет Робина бежать."
  lv_colonisation_events.0001.d.failure:0 "Они не отступают. Бой кажется неизбежным."
  lv_colonisation_events.0001.e.success:0 "Ваши угрозы подрывают их уверенность."
  lv_colonisation_events.0001.e.failure:0 "Они понимают, что вы блефуете. Дело может принять дурной оборот."
  lv_colonisation_events.0001.f.success:0 "Вы побеждаете Робина в поединке, сокрушив его гордость."
  lv_colonisation_events.0001.f.failure:0 "Робин одолевает вас. Вы остаётесь избитым и полным горечи."
  lv_colonisation_events.0001.z.result:0 "Взятку приняли, но какой ценой?"
  lv_colonisation_events.0001.a.tip:0 "Попробуйте перехитрить Робина. Успех даст [gold|E] и [prestige|E], провал обернётся стрессом и потерей монет."
  lv_colonisation_events.0001.b.tip:0 "Предложите помощь с припасами. Успех принесёт припасы, провал опустошит ваш кошель."
  lv_colonisation_events.0001.c.tip:0 "Попробуйте завербовать Джона. При успехе он присоединится к вашему двору. При провале это будет терзать ваш разум."
  lv_colonisation_events.0001.d.tip:0 "Заставьте Робина отступить силой. Победа принесёт добычу, поражение оставит синяки."
  lv_colonisation_events.0001.e.tip:0 "Вселите в них страх. Получится — заберёте трофеи. Провалитесь — почувствуете напряжение."
  lv_colonisation_events.0001.f.tip:0 "Сразитесь с Робином как настоящий удалец. Победите — обретёте славу. Проиграете — вкусите сожаление."
  lv_colonisation_events.0001.z.tip:0 "Дайте взятку и молитесь. Итог? Это может стать благословением... или проклятием."