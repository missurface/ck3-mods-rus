l_russian:
  agot_EE_reestablish_ghiscar_decision:0 "Возродить Гискарскую империю"
  agot_EE_reestablish_ghiscar_decision_desc:0 "Мы стоим на пороге того, чтобы вновь поднять знамя гарпии и вернуть Гискарской империи былую славу. От берегов Залива Работорговцев до сердца Гиса наш древний символ вновь будет реять над землями.\nНаши предки правили силой и мудростью, пока драконий огонь и валирийская сталь не поставили империю на колени. И хотя Старый Гис пал, гискарский дух никогда не дрогнул, терпеливо ожидая нового вождя, который направит гискарский народ к единой цели. Мы готовы пробудить гарпию и позволить ей отбрасывать свою тень на эти земли ещё тысячу лет."
  agot_EE_reestablish_ghiscar_decision_confirm:0 "Гарпия вновь взлетит"
  agot_EE_reestablish_ghiscar_decision_tooltip:0 "Возродить Гискарскую империю, вернув её земли и силу древней гарпии"

  agot_EE_ghiscari_restoration.1.t:0 "Гарпия вновь летит"
  agot_EE_ghiscari_restoration.1.desc:0 "Гарпия вновь летит! В каждом городе и каждой крепости, от берегов Залива Работорговцев до сердца империи, разворачивается древнее знамя Гиса. Некогда наши предки правили этими землями силой и мудростью, пока драконий огонь и валирийская сталь не поставили нашу империю на колени. И хотя стены Старого Гиса обратились в пепел, гискарский дух никогда не умер.\n\nТеперь мы поднимаемся, полные решимости вернуть себе место среди великих империй мира. Наша гарпия отбрасывает тень на землю, напоминая всем, что гискарцев никогда не покоряли — их лишь задержали.\n\nИмперия снова жива, несгибаемая и несломленная..."
  agot_EE_ghiscari_restoration.1.a:0 "За новый Гис!"