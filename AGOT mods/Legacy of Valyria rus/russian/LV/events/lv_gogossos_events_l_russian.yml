l_russian:
  funding_expedition.0001:0 "Финансирование экспедиции"
  fund_expedition_0001_t:0 "Финансирование экспедиции"
  fund_expedition_0001_desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] отправиться в экспедицию, раздобыв необходимые карты исследованных областей вокруг Островов Василиска и рассчитав, сколько припасов мне понадобится. Теперь нужно выбрать место назначения. Между Гогоссосом и Соториосом первый вариант безопаснее, хотя там куда меньше шансов найти что-то ценное. Я могу выбрать более опасный путь и направиться в Соториос: его почти нетронутые земли наверняка полны сокровищ, но в глубине таят ещё большие опасности."
  funding_expedition.0001.a:0 "Стоит отправиться в Гогоссос"
  funding_expedition.0001.b:0 "Стоит отправиться в Соториос (пока не работает, WIP)"
  funding_expedition.0001.z:0 "Неважно"

  gogossos_expedition.0001:0 "Что я нашёл?"
  gogossos_expedition_0001_t:0 "Что я нашёл?"
  gogossos_expedition_0001_desc:0 "После многих дней пути через густые джунгли и грязь мы наконец нашли первые остатки цивилизации. Похоже, это большое каменное здание, заросшее растительностью, хотя сквозь весь подлесок я всё же могу различить очертания двери."
  gogossos_expedition.0001.a:0 "Что тут у нас?"
  gogossos_expedition.0001.a.outcome:0 "Вы начинаете поединок с этой... #emphasis тварью#!"
  gogossos_expedition.0001.b:0 "Думаю, пора уходить..."
  gogossos_expedition.0001.b.outcome:0 "Вы выбираетесь из джунглей и возвращаетесь домой."

  gogossos_expedition.0002:0 "Только не эти проклятые богами загадки с колоннами"
  gogossos_expedition_0002_t:0 "Только не эти проклятые богами загадки с колоннами"
  gogossos_expedition_0002_desc:0 "Мне удалось пройти через вход, и я [Select_CString(ROOT.Char.IsFemale, 'углубилась', 'углубился' )] дальше в руины, которые оказались в довольно изысканном состоянии. Руины ведут в зал с большими стальными вратами и тремя колоннами по сторонам комнаты; на каждой из вращающихся колонн изображены фигуры — собака, орёл, лютоволк и ворон. В центре комнаты стоит одинокий рычаг.\n\nНа стене над дверью можно увидеть фреску. На ней высечены слова:\n\n#emphasis У дерева у реки есть дыра в земле\nПять лютоволков бьются с семью собаками, пока два ворона кружат вокруг\nШесть собак погибли, убив пятерых лютоволков под покровом ночи\nА один ворон был убит орлом в страшной схватке#!\n\nПод каждой частью фрески виден следующий текст:\n\n#emphasis У меня есть время убивать, лукавые взгляды в коридорах\nБез твоего плана\nЧёрный дрозд поёт на холме синей птицы\nБлагодаря зову Дитя Дикого Мудреца#!"

  gogossos_expedition.0002.a:0 "Была не была..."
  gogossos_expedition.0002.a.outcome:0 "Вы тянете рычаг"

  pillar_mural_turn:0 "Вы поворачиваете колонну"
  pillar_mural_one:0 "Первая колонна: $pillar_mural_one_dog$$pillar_mural_one_wolf$$pillar_mural_one_crow$$pillar_mural_one_eagle$"
  pillar_mural_one_dog:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)0' ), 'Собака')]"
  pillar_mural_one_wolf:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)1' ), 'Лютоволк')]"
  pillar_mural_one_crow:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)2' ), 'Ворон')]"
  pillar_mural_one_eagle:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)3' ), 'Орёл')]"

  pillar_mural_two:0 "Вторая колонна: $pillar_mural_two_dog$$pillar_mural_two_wolf$$pillar_mural_two_crow$$pillar_mural_two_eagle$"
  pillar_mural_two_dog:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_two').GetValue, '(CFixedPoint)0' ), 'Собака')]"
  pillar_mural_two_wolf:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_two').GetValue, '(CFixedPoint)1' ), 'Лютоволк')]"
  pillar_mural_two_crow:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_two').GetValue, '(CFixedPoint)2' ), 'Ворон')]"
  pillar_mural_two_eagle:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_two').GetValue, '(CFixedPoint)3' ), 'Орёл')]"

  pillar_mural_three:0 "Третья колонна: $pillar_mural_three_dog$$pillar_mural_three_wolf$$pillar_mural_three_crow$$pillar_mural_three_eagle$"
  pillar_mural_three_dog:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_three').GetValue, '(CFixedPoint)0' ), 'Собака')]"
  pillar_mural_three_wolf:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_three').GetValue, '(CFixedPoint)1' ), 'Лютоволк')]"
  pillar_mural_three_crow:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_three').GetValue, '(CFixedPoint)2' ), 'Ворон')]"
  pillar_mural_three_eagle:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_three').GetValue, '(CFixedPoint)3' ), 'Орёл')]"

  gogossos_expedition.0003:0 "Не верю своим глазам"
  gogossos_expedition.0003_t:0 "Гробница драконьего лорда"
  gogossos_expedition.0003_desc:0 "Войдя в гробницу, я замечаю, что это большая квадратная комната со статуями валирийских рыцарей и прекрасными фресками, изображающими [Concept('old_valyria', 'Старую Валирию')|E] на вершине её могущества.\n\nВ центре комнаты, рядом с большим саркофагом, я вижу аккуратно сложенные груды золота, драгоценные камни и золотые украшения.\n\nСдвинув крышку саркофага, я нахожу внутри скелет и..."
  gogossos_expedition.0003.a:0 "Что тут у нас?"
  gogossos_expedition.0003.outcome:0 "Вы забираете сокровище внутри и завершаете экспедицию в Гогоссосе."

  gogossos_expedition.0003.a.outcome.egg:0 "Вы находите драконье яйцо"
  gogossos_expedition.0003.a.outcome.blood:0 "Вы находите свиток магии крови"
  gogossos_expedition.0003.a.outcome.water:0 "Вы находите свиток магии воды"
  gogossos_expedition.0003.a.outcome.shadow:0 "Вы находите свиток магии теней"

  gogossos_expedition.0004:0 "Не верю своим глазам!"
  gogossos_expedition.0004_t:0 "Не верю своим глазам!"
  gogossos_expedition.0004_desc:0 "Войдя в гробницу в надежде разграбить её сокровища, я тут же замираю на месте. Оцепенев от страха, я [Select_CString(ROOT.Char.IsFemale, 'подняла', 'поднял' )] взгляд и [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )]..."
  gogossos_expedition.0004.a:0 "ДРАКОНА!"

  gogossos_expedition.00041:0 "Не то, чем кажется?"
  gogossos_expedition.00041_t:0 "Не то, чем кажется?"
  gogossos_expedition.00041_desc:0 "К счастью, похоже, дракон давно мёртв и представляет собой лишь гниющую тушу. Но то, на чём покоится его мёртвое тело, вполне реально... золото! Мёртвый дракон лежал на огромной груде золота, хотя остальная часть гробницы, похоже, была осквернена. Все росписи и статуи изуродованы и повреждены до неузнаваемости."
  gogossos_expedition.00041.a:0 "Надеюсь, оно не проклято, как золото Торина"
  gogossos_expedition.00041.outcome:0 "Вы завершаете экспедицию в Гогоссосе."

  gogossos_expedition.00042:0 "Драконоборец"
  gogossos_expedition.00042_t:0 "Драконоборец"
  gogossos_expedition.00042_desc:0 "Адреналин всё ещё бешено разливается по всему моему телу. На мгновение всё казалось нереальным. Вы не уверены, что именно произошло, но в одном уверены точно: этот дракон больше вас не побеспокоит. Вы убили дракона и остались живы, чтобы рассказать об этом."
  gogossos_expedition.00042.a:0 "По крайней мере, за эти хлопоты мне досталось немного золота!"
  gogossos_expedition.00042.outcome:0 "Вы завершаете экспедицию в Гогоссосе."

  gogossos_expedition.0050:0 "Что вообще происходит?"
  gogossos_expedition.0050_t:0 "Что вообще происходит?"
  gogossos_expedition.0050_desc:0 "После нескольких часов пути через джунгли я наткнулся на лагерь, где встретил маленького карлика, подбрасывающего дрова в костёр. Он поднял взгляд, наши глаза встретились, и он мягко заговорил с густым акцентом.\n\n\"И что, по-твоему, ты здесь делаешь, [Select_CString( ROOT.Char.IsFemale, 'девочка', 'мальчик' )]?\" — спросил карлик, на что я [Select_CString(ROOT.Char.IsFemale, 'ответила', 'ответил' )], что [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] бы исследовать руины Гогоссоса в поисках сокровищ. Карлик задумчиво погладил бороду.\n\nВнезапно он издал зловещий смешок и заговорил на безупречном высоком валирийском. Глаза карлика наполнились магией."
  gogossos_expedition.0050.a:0 "Мне как-то нехорошо..."
  gogossos_expedition.0050.a.bear:0 "Ваша экспедиция в Гогоссосе заканчивается, и вы возвращаетесь домой, потому что [Select_CString(ROOT.Char.IsFemale, 'стали глупой медведицей', 'стали глупым медведем' )].\n#weak Это невыносимо!#!"

  gogossos_expedition.0060:0 "Библиотека"
  gogossos_expedition.0060_t:0 "Библиотека"
  gogossos_expedition.0060_desc:0 "Похоже, я [Select_CString(ROOT.Char.IsFemale, 'наткнулась', 'наткнулся' )] на старую библиотеку.\n\nЯ вижу ряды полок: на некоторых ещё лежат книги, другие обветшали и рассыпаются на куски. В глубине можно различить стол, за которым сидит скелет в изорванных одеяниях; перед ним разложено несколько книг. Я едва могу разобрать названия каждой из них."
  gogossos_expedition.0060.outcome:0 "Вы завершаете экспедицию в Гогоссосе."
  gogossos_expedition.0060.a:0 "Книга о боевых приёмах"
  gogossos_expedition.0060.b:0 "Книга о философии"
  gogossos_expedition.0060.c:0 "Книга под названием #emphasis Искусство дипломатии#!"
  gogossos_expedition.0060.d:0 "Книга об управлении владениями и правлении"
  gogossos_expedition.0060.e:0 "Книга под названием #emphasis Государь#!"

  gogossos_expedition.0119:0 "Пираты на горизонте"
  gogossos_expedition.0119_t:0 "Пираты на горизонте"
  gogossos_expedition.0119_desc:0 "Мы отплыли много дней назад, направляясь к приключению в Гогоссосе, и заметили на горизонте корабль под чёрным флагом — обычно в этих водах его поднимают пираты.\n\nБудем надеяться, они нас не заметят..."
  gogossos_expedition.0119.z:0 "Ненавижу пиратов..."

  gogossos_expedition.0110:0 "Нас взяли на абордаж!"
  gogossos_expedition.0110_t:0 "Нас взяли на абордаж!"
  gogossos_expedition.0110_desc:0 "Пираты вскоре настигли наш корабль, и нас взяли на абордаж! Их капитан и его люди прыгают на палубу с поднятыми мечами быстрее, чем я ожидал. Дело плохо..."
  gogossos_expedition.0110.a:0 "Дело совсем плохо..."
  gogossos_expedition.0110.a.outcome:0 "Вы сдаётесь пиратам."
  gogossos_expedition.0110.b:0 "Подтянуть реи, криворукие палубные обезьяны! День, когда можно умереть, — день, ради которого стоит жить!"
  gogossos_expedition.0110.b.outcome:0 "Вы начинаете поединок с пиратским капитаном."

  gogossos_expedition.0120:0 "Пиратов удалось избежать"
  gogossos_expedition.0120_t:0 "Пиратов удалось избежать"
  gogossos_expedition.0120_desc:0 "Похоже, пираты нас не заметили, а если и заметили, то нашим судном точно не заинтересовались.\n\nМы благополучно добрались до берега. С этого момента начинается настоящая опасность: джунгли Гогоссоса зовут нас вперёд."
  gogossos_expedition.120.a:0 "Вперёд — посмотрим, что здесь можно раскрыть"

  gogossos_expedition.0111:0 "Не ровня моему клинку"
  gogossos_expedition.0111_t:0 "Не ровня моему клинку"
  gogossos_expedition.0111_desc:0 "Пират оказался не ровней моему клинку и был сражён. Оставшиеся люди пиратского лорда быстро бежали, позволив нам продолжить плавание. Будем надеяться, дальше путь будет спокойным."
  gogossos_expedition.0111.a:0 "Надеюсь, это была последняя преграда"
  gogossos_expedition.0111.a.outcome:0 "Ваша экспедиция продолжается."

  gogossos_expedition.0112:0 "Моя гордость запятнана"
  gogossos_expedition.0112_t:0 "Моя гордость запятнана"
  gogossos_expedition.0112_desc:0 "Пиратский лорд оказался слишком силён и искусен, чтобы я мог его одолеть: меня победили и ранили. Я всё ещё жив, но моя гордость уязвлена, а теперь я во власти пиратов."
  gogossos_expedition.0112.a:0 "Проклятье!"

  gogossos_expedition.1001:0 "Восхождение"
  gogossos_expedition.1001_t:0 "Восхождение"
  gogossos_expedition.1001_desc:0 "После крушения на берегу мы взяли минуту, чтобы прийти в себя и осмотреть окружающий пейзаж. Высокие утёсы заключили нас в естественную тюрьму, оставив только один путь вперёд — наверх. Иного способа исследовать остров нет, поэтому нам придётся начать восхождение, карабкаясь по скалистым стенам над нами в надежде найти ответы — а может, и сокровища — за их вершинами."
  gogossos_expedition.1001.a:0 "Вперёд и вверх!"
  gogossos_expedition.1001.b:0 "Взлетаем, [my_dragon.GetNameNoTooltip]!"

  gogossos_expedition.1006:0 "Последний спуск"
  gogossos_expedition.1006_t:0 "Последний спуск"
  gogossos_expedition.1006_desc:0 "Мои пальцы впивались в крошащийся камень, сердце бешено колотилось, пока я подтягивался всё выше. Ветер выл и кусал кожу, но я [Select_CString(ROOT.Char.IsFemale, 'заставляла', 'заставлял' )] себя карабкаться дальше. Ещё немного — и выступ под моей ногой обрушился. На один мучительный миг моё тело стало невесомым, руки хватали пустой воздух. Мир закружился, пока я [Select_CString(ROOT.Char.IsFemale, 'падала', 'падал' )] вниз, а берег стремительно нёсся навстречу. Сдавленный вздох сорвался с моих губ — не от страха, а от осознания: вот и всё. Затем — тишина."
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Мраморный дворец"
  gogossos_expedition.1002_t:0 "Мраморный дворец"
  gogossos_expedition.1002_desc:0 "Поднявшись на гребень сурового утёса, я стряхиваю с себя пыль и обломки и выдыхаю, пока мир раскрывается перед моим взглядом. Земля тянется далеко и широко — захватывающее полотно из зубчатых скал, густых джунглей и холмов, залитых золотым сиянием умирающего солнца. Из кроны леса внизу поднимается туман, вьющийся призрачными щупальцами между древними деревьями; их изумрудные листья блестят остатками дневного жара. Но за джунглями, за этой дикой, необузданной красотой, мой взгляд прикован к чему-то поистине великолепному — дворцу из чистого белого камня, гордо и царственно стоящему на далёком холме. Его высокие шпили пронзают небо, ловя последний свет дня и сияя, словно цитадель забытых богов.\n Меня охватывает трепет, непреодолимое влечение, будто сама судьба зовёт меня. Должно быть, именно там лежит сокровище — запечатанное в мраморных стенах, скрытое в отголосках погибших империй. Но время против меня. Ночью джунгли внизу станут коварны: их тени скрывают неведомых существ, а глубины живут шёпотом опасности."

  gogossos_expedition.1007:0 "К дворцу!"

  gogossos_expedition.1003:0 "Безмолвный дворец"
  gogossos_expedition.1003_t:0 "Безмолвный дворец"
  gogossos_expedition.1003_desc:0 "Когда я вхожу через величественный вход дворца, передо мной раскрывается странный контраст. Снаружи его сияющие белые стены и высокие шпили стоят нетронутыми временем — царственные и несгибаемые. Но внутри уже воцарилось тление. Некогда величественные залы рушатся, их позолоченные арки потрескались и обветшали. Пыль забивает воздух, а запах гнили держится в неподвижной тишине. Сломанная мебель, давно обращённая в руины, разбросана по каменным полам; её некогда богатые ткани превратились лишь в изорванные остатки прошлого.\n\nЯ ищу, продвигаясь всё глубже по заброшенным коридорам, но ничего не нахожу — ни сокровищ, ни признаков жизни, только отголоски забытой эпохи. Кажется, будто сам дворец стал пустой оболочкой, полой скорлупой былого величия, давно оставленной временем. И всё же, когда сомнение уже начинает подкрадываться ко мне, я нахожу лестницу, уходящую вниз, во тьму.\n\nПовинуясь неведомой тяге, я спускаюсь в подвал, где последние лучи солнца проходят сквозь изящные хрустальные зеркала, рассыпая по залу мерцающие потоки золота и фиолета. Свет ложится на нечто захватывающее — древние валирийские изображения, высеченные в камне над большой дверью передо мной. Эти картины рассказывают историю силы и огня, могущественных драконьих лордов, царящих в небесах, и их великих зверей, вьющихся среди облаков пламени. Их глаза, вырезанные из драгоценных камней, поблёскивают в преломлённом свете, словно наблюдают за мной и судят меня.\n Я задерживаюсь, заворожённый мастерством и всей тяжестью истории, давящей на это место. Но затем меня охватывает леденящее осознание: во всём этом дворце я не видел ни следа мёртвых. Ни скелетов. Ни останков тех, кто когда-то называл это место домом.\n Место, оставленное временем... но будто не тронутое смертью.\nПо спине пробегает дрожь, когда я подхожу ближе к большой двери, держа руку над её холодной поверхностью. Здесь что-то не так. И сейчас я выясню, что именно."
  gogossos_expedition.1003.a:0 "Что ж, похоже, идём в подвал"
  #palace.1:0 "The only way forward is down...."

  gogossos_expedition.1004:0 "Фреска"
  gogossos_expedition.1004_t:0 "Фреска"
  gogossos_expedition.1004_desc:0 "Чем глубже я спускаюсь в недра дворца, тем бесконечнее кажется винтовая лестница, а воздух с каждой ступенью становится всё холоднее. Тени извиваются и корчатся вдоль древних каменных стен, но я продолжаю путь, движимый одновременно любопытством и тревогой. Наконец я достигаю низа — огромного зала, невозможным образом освещённого, несмотря на глубину. Мягкий золотой свет льётся из невидимых источников, покрывая стены потусторонним сиянием.\n\nУ меня перехватывает дыхание, когда я вижу перед собой ещё одну великолепную фреску — непревзойдённую по мастерству, исполненную величия и благоговения. На ней изображены драконы во всей своей царственной славе: каждый уникален, каждый поражает своим великолепием.\n\nМогучий пурпурный дракон, чья чешуя мерцает, словно аметист, извергает поток пламени; его сила не знает равных.\n\nБелый дракон, стремительный и свирепый, будто расплывается в движении, его тонкое тело рассекает облака, словно клинок.\n Красный дракон, чьи глаза горят злобой, возвышается как тиран; одно его присутствие внушает страх и ужас.\n\nИ наконец — чёрный дракон: загадочный, почти мифический, окутанный аурой тёмного величия, будто он существует между этим миром и следующим.\n\nУ меня есть лишь миг, чтобы восхититься красотой фрески; мои пальцы скользят по краю искусной резьбы. И тут раздаётся звук. Низкий, знакомый стон древнего камня, приходящего в движение. Сердце замирает в груди, холод пробегает по спине, а шум становится громче и яростнее. Я резко оборачиваюсь, широко раскрыв глаза от тревоги, как раз в тот миг, когда пол подо мной проваливается.\n Мир кренится, и я [Select_CString(ROOT.Char.IsFemale, 'становлюсь невесомой', 'становлюсь невесомым' )]; крик застревает в горле, пока камень рассыпается во тьму. Разум едва успевает осознать ужас, прежде чем я падаю в неизвестность внизу, а слабое сияние фрески исчезает над головой."
  gogossos_expedition.1004.a:0 "О нет..."

  # evil_death_events.1:0 "I Can't Take it..."
  # evil_death_events.1_t:0 "I Can't Take it..."
  # evil_death_events.1_desc:0 "I can't take it anymore. These four doors stand before me, each one pulsing with an unseen energy, yet none offering a way out. Purple, White, Red, Black—no matter how long I stare, no matter how much I search for answers in their intricate designs, they remain an enigma. There's no escape, no exit from this wretched place. Just the cold, unyielding stone, the eerie glow of the crystals, and the oppressive silence that seems to stretch into eternity.\n\nI'm doomed to waste away here, trapped in this endless nightmare, with nothing but these cursed doors and my own growing despair for company. My strength is already failing me, my body weakening with every passing moment. I can feel the emptiness creeping in, my mind clawing at the edges of sanity.\n\nBut I won't let it end like this. I refuse to wither into a husk, to become a shadow of myself, forgotten and consumed by this place. If this is to be my end, it will be on my terms, by my own hand. I will not let dishonor take me, nor the slow, cruel grip of starvation.\n\nI glance at the doors one last time, their silent presence mocking me, and steel myself for what must be done. Better to face the unknown than to let this cursed palace strip me of all that I am. Better to go with defiance in my heart than to let the darkness claim me piece by piece."
  # sewingside.1:0 "I pull out my sword one last time..."

  gogossos_expedition.1005:0 "Дверная лавка Медведя"
  gogossos_expedition.1005_t:0 "Дверная лавка Медведя"
  gogossos_expedition.1005_desc:0 "Пока я стою в зловещем сиянии кристаллов, передо мной раскрывается огромный и пустой зал — если не считать четырёх дверей, занимающих дальнюю стену. Каждая дверь массивна и покрыта искусной резьбой, а её детали освещены мерцающим светом кристаллов над головой. Сердце колотится, когда я делаю шаг ближе, притянутый их мрачным присутствием.\n\nЭти двери не похожи ни на что из виденного мной прежде: каждая излучает собственную особую ауру, будто в неё вложена сила.\n\nПурпурная дверь блестит, словно отполированный аметист; её поверхность оживлена резьбой с пламенем и извивающимися змееподобными драконами. Огонь, который они извергают, кажется почти живым, когда свет падает под нужным углом, а воздух вокруг гудит неземной энергией.\n\nБелая дверь, напротив, гладкая и изящная, словно отполированная слоновая кость. Её резьба изображает дракона в полёте: тонкое и грациозное тело, широко раскинутые крылья, будто он навеки застыл в движении. Холодный свет кристаллов придаёт ей почти призрачное сияние, словно время её не коснулось.\n\nКрасная дверь дерзкая и пугающая. Её поверхность покрыта резкими, хаотичными узорами; линии глубоки и грубы, будто само пламя выжгло их в дереве. В её раме вырезан чудовищный дракон с жестокими острыми глазами, и от одного его вида веет угрозой. Даже рядом с этой дверью воздух кажется тяжёлым и давящим.\n\nЧёрная дверь самая загадочная. Она словно поглощает свет; её поверхность гладкая и тёмная, как обсидиан. Тени будто пляшут по ней, меняясь и извиваясь, словно живые. Резьба здесь тонкая, её трудно разобрать, но изображённый дракон кажется потусторонним, почти непостижимым — скорее духом, чем зверем.\n\nКаждая дверь слабо пульсирует невидимой силой, будто манит меня вперёд. Но ничто не говорит о том, что скрывается за ними. Мой взгляд мечется между дверями, мысли несутся одна за другой. Это конец дворца? Или начало чего-то куда худшего?\n\nИнстинкты кричат, что нужно выбирать осторожно, но, что бы ни случилось, я знаю: пути назад уже нет. За одной из этих дверей лежит мой путь вперёд — или моя гибель."
  gogossos_expedition.1005.a:0 "Пурпурная дверь"
  gogossos_expedition.1005.b:0 "Белая дверь"
  gogossos_expedition.1005.c:0 "Красная дверь"
  gogossos_expedition.1005.d:0 "Чёрная дверь"
  gogossos_expedition.1005.z:0 "Я больше не хочу этим заниматься...."

  gogossos_expedition.1008:0 "Тёмные залы тянутся всё дальше!"
  gogossos_expedition.1008_t:0 "Тёмные залы тянутся всё дальше!"
  gogossos_expedition.1008_desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'добралась', 'добрался' )]. Каким-то образом мне удалось пройти через безумную ловушку комнаты с дверями, и теперь я стою ещё глубже в искривлённых недрах дворца. Дыхание сбито, сердце колотится в груди, пока я на миг пытаюсь взять себя в руки. Воздух здесь кажется тяжелее и холоднее, будто он давит на меня, а слабое сияние кристальных огней всё ещё держится впереди, указывая путь.\n\nПередо мной тянется длинный коридор — невозможной длины, с концом, поглощённым тенями. Стены высечены из того же древнего камня, что и остальной дворец, но здесь они покрыты слабо светящимися рунами — узорами забытого языка, которые мягко пульсируют, словно живые. Коридор будто наполнен жуткой энергией, странной вибрацией, которую я чувствую костями.\n\nПол под ногами сырой, скользкий от конденсата, и каждый мой шаг отдаётся эхом по коридору, возвращаясь ко мне шёпотом. Кажется, будто это место наблюдает, слушает и ждёт.\n\nВ этом проходе есть что-то тревожное — нечто такое, от чего волосы на затылке встают дыбом. С каждым шагом воздух становится холоднее, а странный низкий гул начинает заполнять тишину. Сначала он далёкий, но чем дальше я иду, тем громче становится — словно звук далёкого сердцебиения, глубокий и гулкий.\n\nКоридор кажется бесконечным, а тени впереди не желают уступать свету. Каждый инстинкт велит мне повернуть назад, найти другой путь, но я знаю: назад дороги уже нет. Что бы ни ждало в конце этого коридора, мне придётся встретиться с этим лицом к лицу. Мои пальцы крепче сжимают рукоять оружия, и я продолжаю идти вперёд, с каждым шагом погружаясь всё глубже в неизвестность."
  gogossos_expedition.1008.a:0 "По крайней мере, это не Закулисье...."

  gogossos_expedition.1009:0 "Маг!"
  gogossos_expedition.1009_t:0 "Маг!"
  gogossos_expedition.1009_desc:0 "Наконец коридор заканчивается. Передо мной на полу лежит разбитая старая деревянная дверь, её щепки разбросаны вокруг, словно остатки давно забытой преграды. За сломанной рамой открывается комната, не похожая ни на что из виденного мной во дворце, — покои мага, нетронутые временем, но тяжёлые от чувства заброшенности.\n\nКомната представляет собой хаотичный шедевр: вдоль стен стоят высокие книжные полки, забитые древними томами, свитками и обрывками пергамента. Воздух густ от слабого запаха старой бумаги и едкой нотки давно замерших алхимических опытов. Стеклянные флаконы, одни треснувшие, другие всё ещё целые, загромождают столы; внутри них мерцают жидкости в бледном свете кристаллов над головой. Рядом стоят странные устройства непонятного назначения, их латунные и серебряные корпуса потускнели, но всё ещё поражают тонкостью работы.\n\nНо моё внимание привлекает стол в глубине комнаты. Там, склонившись над его поверхностью, лежит скелет в изорванной мантии с капюшоном. Кости пожелтели от времени, но в его позе есть что-то странно осмысленное. Будто маг — если он и был магом — знал, что конец близок, и сам выбрал это место своим последним пристанищем.\n\nПеред скелетом, разбросанные по столу, лежат разные предметы. В центре покоится пыльный дневник в кожаном переплёте: обложка потрескалась, но осталась целой. Воздух вокруг него кажется тяжёлым, словно внутри скрыты тайны, которым следовало бы остаться погребёнными. Рядом с дневником, поблёскивая даже в слабом свете, лежит несколько золотых слитков; их края стёрлись, но ценность не вызывает сомнений.\n\nЯ подхожу ближе, затаив дыхание, и оглядываю всё вокруг. Дневник будто зовёт меня; его присутствие притягивает внимание куда сильнее, чем золото. Мои пальцы замирают над обложкой в нерешительности. Кажется, эта комната хранит ответы — или, возможно, ещё больше вопросов.\n\nКем был этот маг? Что с ним случилось? И почему мне кажется, что я [Select_CString(ROOT.Char.IsFemale, 'наткнулась', 'наткнулся' )] на нечто, что никогда не должно было быть найдено?"

  gogossos_expedition.1009.b:0 "Что написано в дневнике?"

  gogossos_expedition.1210:0 "Мечта всей жизни..."
  gogossos_expedition.1210_t:0 "Мечта всей жизни....."
  gogossos_expedition.1210_desc:0 "Я беру дневник дрожащими руками, стряхивая тонкий слой пыли, осевший на нём. Пальцы скользят по потрескавшейся кожаной обложке, пока я перелистываю хрупкие страницы; чернила выцвели, но слова всё ещё можно разобрать. Я быстро пробегаю глазами последнюю запись, притянутая последними мыслями давно мёртвого мага.\n\nЭти слова холодят меня до глубины души. Он писал о своих последних часах, о том, как гогоссосская кровавая чума овладела его телом, терзая его изнутри. Его описания ярки и жутки: жар, кровотечение и слабость, поглотившая его и лишившая сил продолжать работу. Он скорбел о незавершённых опытах, растраченном даре и наследии, которое так и не оставит после себя. Его отчаяние сочится со страницы; каждое слово мучительно напоминает, каким жестоким и окончательным был его конец.\n\nНо прежде чем я успеваю углубиться дальше, комната начинает дрожать. Низкий гул, похожий на рычание пробуждающегося зверя, проходит вибрацией по каменным стенам. Сверху густыми облаками сыплется пыль, а слабый свет кристаллов начинает бешено мерцать. Я поднимаю взгляд: сперва падают мелкие камни, затем потолок отвечает стонущими трещинами, смещаясь под давлением невидимой силы. Комната рушится.\n\nПаника заливает мои жилы. Я отталкиваю дневник обратно на стол — он слишком тяжёлый и слишком хрупкий, чтобы нести его с собой, — и вместо этого хватаю сияющие золотые слитки. Инстинкты кричат мне бежать, выбраться, пока меня не похоронило заживо рядом с останками мага.\n\nЯ бросаюсь к двери — или к тому, что от неё осталось, — но едва достигаю порога, как руническая вязь, вырезанная на полу, вспыхивает жизнью. Светящиеся символы пульсируют ослепительной силой, наполняя комнату потусторонним сиянием. Грохот рушащегося зала тонет в резком, почти оглушительном гуле, и прежде чем я успеваю понять, что происходит, моё зрение поглощает белый свет.\n\nКогда свет меркнет, я уже не во дворце.\n\nЯ стою на пляже. Тёплый песок сдвигается под ногами, а в ушах звучит шум волн, разбивающихся о берег. Солёный привкус морского воздуха невозможным контрастом сменяет холодную, гниющую атмосферу, которую я только что [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул' )]. Сердце бешено колотится, пока я резко оглядываюсь, пытаясь понять, что только что произошло. Дворец, рушащаяся комната, маг — всё исчезло, заменённое бесконечным горизонтом моря и неба.\n\nЯ крепко сжимаю золотые слитки, дыхание всё ещё сбито после хаоса, а разум мечется от вопросов. Как я здесь [Select_CString(ROOT.Char.IsFemale, 'оказалась', 'оказался' )]? Почему руны перенесли меня именно сюда? Это был защитный механизм, оставленный магом, или вмешательство некой невидимой силы?\n\nЕдинственное, в чём можно быть уверенным: мне удалось спастись — пока что. Но этот пляж... он кажется слишком мирным, слишком совершенным. И где-то глубоко внутри я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что всё это было настоящим."
  gogossos_expedition.1210.b:0 "Давай... просто вернёмся домой..."
  gogossos_expedition.1210.b.outcome:0 "Вы завершаете экспедицию в Гогоссосе."
  ambush.1:0 "А-А-А-А-А-А-А-А-А-А!!!!"

  gogossos_expedition.1100:0 "Драконья палата"
  gogossos_expedition.1100_t:0 "Драконья палата"
  gogossos_expedition.1100_desc:0 "Когда я спускаюсь в подвал, по спине пробегает холодок. Воздух густ от пыли и запаха чего-то древнего — чего-то давно забытого. Мои шаги отдаются эхом в тусклом свете, но затем я резко останавливаюсь, застыв на месте.\n\nПередо мной, нависая в тенях, лежит дракон. Настоящий, живой дракон. Его огромная фигура свернулась во тьме, чешуя слабо мерцает даже в полумраке. У меня перехватывает дыхание. Это невозможно. Драконьи лорды древности давно ушли в легенды — как один из их зверей мог всё ещё существовать здесь, скрытый под этим местом?\n\nСмесь благоговения и ужаса сковывает меня, но среди страха возникает другая мысль. В этом месте куда больше, чем я мог представить. Тайны, погребённые под толщей веков, загадки, ждущие разгадки.\n\nНо весь этот путь был пройден не для того, чтобы вернуться с пустыми руками. Если этот дракон так долго сохранялся здесь, значит, в этих стенах должно быть скрыто нечто поистине ценное. И я намерен забрать свою награду."

  gogossos_expedition.1100.a:0 "Я убью этого зверя и заберу свой приз!"
  gogossos_expedition.1100.b:0 "Во мне течёт кровь дракона! Ты склонишься передо мной!"
  gogossos_expedition.1100.b.outcome:0 "Вы пытаетесь приручить дракона. Независимо от исхода, ваша экспедиция в Гогоссосе завершится здесь."

  gogossos_expedition.1101:0 "Победитель"
  gogossos_expedition.1101_t:0 "Победитель"
  gogossos_expedition.1101_desc:0 "Битва была жестокой, каждое мгновение испытывало волю и выносливость. Дракон ревел, его огненное дыхание опаляло воздух, но я уже [Select_CString(ROOT.Char.IsFemale, 'научилась', 'научился' )] читать его движения. С каждым громовым ударом когтей я танцевал между смертью и спасением, а мой клинок находил просветы там, где чешуя расходилась хоть на миг. Он бросился вперёд, и я перекатился под ним, вонзив оружие глубоко в его открытое брюхо. Оглушительный визг разорвал зал, когда зверь забился в конвульсиях, а его огромный хвост крушил камень в последней отчаянной борьбе.\n\nСобрав последние силы, я вскарабкался ему на спину, ухватился за гребни вдоль хребта и вонзил меч в основание черепа. Дракон издал последний дрожащий выдох и рухнул, сотрясая землю своим громадным телом. Я стоял над ним, тяжело дыша, с кожей, покрытой кровью и копотью. Некогда могучее создание лежало неподвижно, и его давно забытое владычество наконец подошло к концу.\n\nПоследовавшая тишина была тяжёлой, но сожаления я не чувствовал. Я убил легенду — и теперь добыча из его древнего логова принадлежала мне."

  gogossos_expedition.1101.a:0 "Что это?"

  gogossos_expedition.1102:0 "Испытание крови"
  gogossos_expedition.1102_t:0 "Испытание крови"
  gogossos_expedition.1102_desc:0 "Убив дракона и завладев его сокровищами, я обратил взгляд к дальнему концу зала, где ждало нечто куда более зловещее. Передо мной возвышалась огромная дверь, выкованная из почерневшей стали. Искривлённая и зазубренная, она несла на себе изображение рычащего лица, застывшего в вечной гримасе; его разверстая пасть была достаточно широка, чтобы проглотить человека целиком.\n\nПеред дверью стоял древний и обветренный каменный столб, на котором покоилась простая чаша. На первый взгляд в ней не было ничего примечательного, если не считать странных рун, высеченных по краю, — символов, которые, казалось, менялись и извивались под моим взглядом. Внутри чаши неподвижно лежал ржавый кинжал; его некогда острое лезвие притупилось от времени и тления.\n\nСтоило мне подойти ближе, как по спине пробежала дрожь. Шёпоты — тихие, коварные — коснулись моего разума, словно холодные пальцы. Они манили меня, бормоча слова, которых я не понимал, но почему-то чувствовал в костях. Они тянули меня, подталкивали вперёд, заставляя взять кинжал.\n\nТребуемое подношение было очевидно. Кровь. Моя собственная. Руны слабо пульсировали, словно ощущая моё колебание, а шёпоты становились всё нетерпеливее. Что бы ни скрывалось за этой дверью, оно не откроется без жертвы."

  gogossos_expedition.1102.a:0 "Лучше ограничиться малым подношением"
  gogossos_expedition.1102.b:0 "Только большое подношение будет достаточным"
  gogossos_expedition.1102.c:0 "Не думаю, что это мудро. Лучше оставить это в покое"
  gogossos_expedition.1102.c.outcome:0 "Вы завершаете экспедицию в Гогоссосе."

  gogossos_expedition.2001:0 "Ну ты и болван!"
  gogossos_expedition.2001_t:0 "Ну ты и болван"
  gogossos_expedition.2001_desc:0 "Нож, хоть и казался тупым и изношенным, рассёк мою кожу словно масло. Ни сопротивления, ни боли — только пугающая лёгкость, с которой он прошёл сквозь плоть. Кровь тут же выступила наружу и густыми багряными ручьями потекла в ожидающую чашу. Руны по её краю вспыхнули болезненным светом, словно жадно пили моё подношение.\n\nЗатем дверь застонала. Медленный, скрежещущий звук — металл тёрся о камень. Искривлённое лицо, вырезанное на двери, будто изменилось: его прежний оскал растянулся во что-то куда худшее — в улыбку. Глубокую, понимающую улыбку. Волна головокружения накрыла меня. Зрение расплылось, темнея по краям. Меня качнуло, я пытался удержаться на ногах, но конечности стали невыносимо тяжёлыми. И всё же я видел это — дверь открывалась. Что бы ни было за ней, оно оказалось почти в моей досягаемости. Я заставил себя двинуться вперёд, принуждая тело слушаться. Но затем упал. Резко, беспощадно, на холодный каменный пол. Паника захлестнула меня, когда я попытался подняться, но сил уже не осталось. Кинжал выскользнул из пальцев и бесполезно звякнул рядом. И тогда пришёл настоящий ужас.\n\nБоль. Сначала это было медленное, ползущее ощущение под кожей, а затем оно расцвело мукой. Плоть покалывало, потом жгло, потом она начала увядать. Я судорожно вдохнул, но воздух не пришёл. Вены почернели, кожа растрескалась и стала слезать отвратительными пластами. Кровь текла уже не только из руки — она лилась отовсюду. Моё тело распадалось, гнило прямо у меня на глазах. Я попытался закричать, но горло сжалось и провалилось внутрь, а голос был украден той самой силой, которую я пытался пробудить. Последнее, что я увидел перед тем, как тьма забрала меня, была дверь, распахнутая настежь. А за ней — тени, шевелящиеся и наблюдающие.\n\nЗатем не осталось ничего."
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "Хранилище желаний"
  gogossos_expedition.2002_t:0 "Хранилище желаний"
  gogossos_expedition.2002_desc:0 "Нож, хоть и казался тупым и изношенным, рассёк мою кожу словно масло. Ни сопротивления, ни боли — только пугающая лёгкость, с которой он прошёл сквозь плоть. Кровь тут же выступила наружу и густыми багряными ручьями потекла в ожидающую чашу. Руны по её краю вспыхнули болезненным светом, словно жадно пили моё подношение.\n\nЗатем дверь застонала. Медленный, скрежещущий звук — металл тёрся о камень. Искривлённое лицо, вырезанное на двери, будто изменилось: его прежний оскал растянулся во что-то куда худшее — в улыбку. Глубокую, понимающую улыбку.\n\nНо затем произошло нечто неожиданное. Резкое покалывание пробежало по моей ладони, и, когда я опускаю взгляд, рана уже исчезла. Кожа снова сомкнулась, подношение крови было принято, но не оставило и следа вреда. Дыхание сбилось, пока я шагнул за порог теперь уже открытой двери, в зал по ту сторону.\n\nХранилище желаний.\n\nМои глаза расширились от открывшегося зрелища: золотые артефакты громоздились высокими грудами, украшенные самоцветами кубки поблёскивали в тусклом свете факелов, драгоценные камни были рассыпаны по полу, словно простая галька. Богатство за пределами воображения, нетронутое веками. Это было настоящее сокровище — клад, который охранял дракон, награда, скрытая за его чудовищным телом.\n\nНо среди всех сверкающих богатств один предмет привлёк мой взгляд сильнее прочих. На пьедестале, залитый неземным сиянием, покоился артефакт, который я искал. Причина, по которой я [Select_CString(ROOT.Char.IsFemale, 'зашла', 'зашёл' )] так далеко. Сердце бешено колотилось, когда я [Select_CString(ROOT.Char.IsFemale, 'подступила', 'подступил' )] ближе, и вся тяжесть моего пути сошлась в этом единственном, долгожданном мгновении."
  gogossos_expedition.2002.a:0 "Он прекрасен..."
  gogossos_expedition.2002.a.outcome:0 "Вы завершаете экспедицию в Гогоссосе."

  evil_death_events.1:0 "Я больше не могу..."
  evil_death_events.1_t:0 "Я больше не могу..."
  evil_death_events.1_desc:0 "Передо мной стоят четыре двери — пурпурная, красная, белая и чёрная. Я перепробовал их все, входя в каждую по очереди, лишь чтобы снова оказаться в этой же проклятой комнате. Какой бы путь я ни выбрал, сколько бы раз ни делал выбор, я всегда возвращаюсь сюда. Искажённая петля, тюрьма без стен.\n\nЯ сжимаю кулаки, дыхание сбивается, а досада впивается в меня когтями. Я больше не могу продолжать. Бесконечный круг, удушающее повторение — всё это ломает меня. Но я не позволю безумию овладеть мной. Я не стану голодать и чахнуть в этом месте, ожидая спасения, которого не существует.\n\nЕсли это всё, что мне осталось, тогда я закончу всё на своих условиях."

  sewingside.1:0 "Я обнажаю меч в последний раз..."