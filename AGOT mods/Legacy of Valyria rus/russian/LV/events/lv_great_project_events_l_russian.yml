  lv_great_project.0001.t:0 "Нарушая тишину: [sub_region.GetName]"
  lv_great_project.0001.desc:0 "Первый удар лопаты — звук, которому не место в этих пустынных землях. Восстановительные работы в [sub_region.GetName] начались, став актом кощунства против Рока и тишины, которую он навязал.\n\nВы выбрали опорную точку для этого монументального проекта — участок разрушенной чёрной земли рядом с наполовину обвалившейся стеной, возможно, некогда бывшей виллой или небольшой башней. Пока ваши работники начинают расчищать худшие завалы пепла и искорёженных обломков, сама земля будто вздыхает в отказе. Воздух становится тяжелее, жара — сильнее.\n\nМагия, древняя и неукрощённая, дремлет прямо под поверхностью. Это ещё не сила, которой можно повелевать, а яд, сопротивляющийся самой идее порядка. Семена, которые вы пытаетесь посеять, съёживаются в угольные хлопья. Вода, набранная из близкого тёплого источника, отдаёт серой и забытыми заклятиями. Каждый час работы приносит лишь несколько мгновений зыбкого прогресса. Рок не ушёл; он просто замер, ожидая выскочку, который напомнит ему, что он всё ещё правит."
  lv_great_project.0001.desc.attempted:0 "Второй — а может, уже сотый — удар лопаты здесь не звучит как нечто новое: это крик неповиновения Року. Восстановление [sub_region.GetName] — не начало, а изнурительное продолжение уже проделанной работы.\n\nВы осматриваете нынешнюю опорную точку. Те, кто был здесь до вас, или ваши собственные прежние усилия уже оставили в Валирии следы борьбы: полосы расчищенного пепла, которые уже начинают расплываться, груды спасённого камня и призрачные остатки неудавшихся садов или рухнувших фундаментов.\n\nВаши работники движутся с закалённой осторожностью. Они знают ритм этой работы — круг ложных начал и внезапных, яростных откатов. Земля больше не вздыхает в удивлённом отказе; теперь кажется, будто она насмехается над вашим упорством. Древняя, неукрощённая магия здесь уже научилась ожидать вторжения. Она выработала невосприимчивость к малым попыткам порядка. Слабый привкус серы в воде и то, как воздух давит на место работ, — уже привычные опасности, а не неожиданности.\n\nОтголоски Рока напоминают: вы боретесь не с последствиями, а с живым шрамом. Но эта попытка несёт в себе вес всего, что было раньше. Если вам удастся опереться на эти хрупкие, неудавшиеся основания, вы наконец докажете, что последнее слово о [sub_region.GetName] остаётся не за Роком."
  lv_great_project.0001.desc.succeeded:0 "Этот удар лопаты отзывается тяжестью и руин, и воскресения. Земля под [sub_region.GetName] всё ещё отравлена, но теперь вы знаете: яд можно обезвредить. Формула уже была найдена; теперь вам нужно применить её снова.\n\nВы выбрали опорную точку уже не во тьме, а в тени чуда. Ваши работники могут смотреть к горизонту Валирии и знать, что где-то среди этих призрачных земель есть доказательство — далёкое, мерцающее видение успешно возвращённой области, где стены стоят прямо, где дым поднимается от очагов, а не от серных трещин, и где зелёная жизнь утверждает себя вновь. Именно это знание и есть настоящий фундамент нового труда.\n\nНо вдохновение мало утешает перед непосредственной реальностью. Когда ваша команда начинает расчищать знакомые искорёженные камни и удушающий пепел, воздух остаётся густым и враждебным. Магическое сопротивление здесь упрямо, возможно, присуще именно [sub_region.GetName], и борется против уже найденного пути исцеления. Первые семена всё ещё с трудом цепляются за жизнь, а местная вода остаётся суровой, словно сам Рок отказывается признать поражение именно на этой земле.\n\nЭто монументальное испытание. Путь уже был показан, но он не стал лёгким. Вы сражаетесь не со всеобщим отчаянием, а с упрямой последней обороной уничтожения. Каждая крупица прогресса здесь — тяжело добытая победа, расширяющая чудо и отодвигающая границы жизни всё глубже в сердце мёртвой империи."
  lv_great_project.0001.a:0 "Битва за Валирию по-настоящему начинается."
  lv_great_project.0001.a.attempted:0 "Битва за Валирию продолжается."
  lv_great_project.0001.a.succeeded:0 "Возрождение Валирии началось."

  lv_great_project.0003.t:0 "Новый рассвет для [sub_region.GetName]"
  lv_great_project.0003.desc:0 "Поколения будут рассказывать об этом дне. У долгой ночи Рока появился новый рассвет, и он начинается над регионом [sub_region.GetName].\n\nВы стоите на высшей точке только что восстановленной области и смотрите на новые стены и первые надёжные дороги. Это первый настоящий город жизни, поднявшийся в сердце Валирии с тех пор, как она была сокрушена Роком. Цена была высока, неудачи — сокрушительны, но итог стал триумфом, бросающим вызов самой истории.\n\nЗвон кузнечного молота, крики местных торговцев, ровный гул обычных разговоров. Все эти новые звуки заглушают шёпот мёртвых. От мейстеров Цитадели до чародеев Асшая — об этом дне будут говорить, возможно, до конца времён.\n\nИ всё же, глядя на дымящуюся, хаотичную пустошь за своими границами, вы ощущаете глубокое одиночество. Вы выиграли битву, но война за Валирию — борьба за каждый разрушенный клочок земли — только началась. Наследие Валирии теперь лежит на плечах живых."
  lv_great_project.0003.desc.subsequent:0 "Долгая ночь Рока продолжает рассыпаться. Над регионом [sub_region.GetName] теперь открывается новый сияющий участок чистого неба.\n\nВы стоите на высшей точке только что восстановленной области и смотрите на новые стены и надёжные дороги. Этот регион стал мощным новым якорем в мёртвом сердце Валирии, добавив свою силу царству живых. Цена была сокрушительной, неудачи — бесчисленными, но итог стал триумфом, многократно расширяющим великий труд.\n\nЗвон кузнечного молота, крики местных торговцев, ровный гул обычных разговоров. Все эти победные звуки теперь усиливают хор жизни.\n\nИ всё же, глядя на дымящуюся, хаотичную пустошь за своими границами, вы чувствуете огромную тяжесть задачи, что ещё впереди. Вы не завершили войну, но успешно вырвали ещё одну незаменимую добычу из когтей уничтожения. Борьба за Валирию продолжается, но с закреплением [sub_region.GetName] окончательная победа живых кажется ближе, чем когда-либо. Наследие Валирии теперь покоится на плечах живых увереннее, чем прежде."
  lv_great_project.0003.a:0 "Новый маяк жизни сияет в Валирии."

  lv_great_project.0004.t:0 "Валирия: земля возрождённая"
  lv_great_project.0004.desc:0 "По всему известному миру — от берегов Вестероса до пряных рынков Кварта, от башен Цитадели до храмов И-Ти — одну ошеломляющую истину шепчут, выкрикивают и записывают: Валирия снова жива.\n\nПосле разрушения, принесённого Роком, невозможное было достигнуто. Регион [sub_region.GetName] был возвращён, укреплён и обезопасен несгибаемой волей [founder.GetName] и работников, осмелившихся бросить вызов Року. Воздух здесь, некогда ядовитый, теперь вдыхают живые. Почва, некогда проклятая, теперь отвечает плугу.\n\nЗемля [sub_region.GetName], некогда отравленная и haunted призраками задушенного Фригольда, теперь служит доказательством предельной силы восстановления. [founder.GetName] [Select_CString(founder.IsFemale, 'бросила', 'бросил' )] вызов самому проклятию, поглотившему величайшую империю в истории, и [Select_CString(founder.IsFemale, 'одержала', 'одержал' )] первую, жизненно важную победу.\n\nПусть все города и королевства знают: ужас остаётся, опасности всё ещё велики, а дымящаяся тень Рока всё ещё охватывает континент. Но зажжён свет, который не сможет погасить никакой пепел. Дорога обратно к Валирии больше не заперта полной, безжизненной тишиной. Старый мир дрожит, и эпоха долгого, медленного возвращения началась."
  lv_great_project.0004.a:0 "Пусть мир узнает: Валирия снова жива."
  lv_great_project.0004.a.other:0 "Любопытно..."

  lv_great_project.0006.t:0 "Валирийские сокровища"
  lv_great_project.0006.t.major:0 "Сокровища драконьих лордов"
  lv_great_project.0006.desc:0 "Земля отдала сокровище, которому нет меры. Исследовательская группа вскрыла гробницу — а возможно, забытое подземное хранилище, — нетронутую с тех пор, как Рок обрушился на Валирию.\n\nПрорыв произошёл под самым глубоким слоем застывшего пепла: там была обнаружена идеально запечатанная палата, вход в которую скрывал обвалившийся потолок из сплавленного драконьего камня. Внутри мир Старой Валирии застыл во времени. Большие сундуки с золотыми и серебряными монетами, не тронутыми веками, стояли у стен, покрытых валирийскими письменами.\n\nНо истинное значение находки скрывается глубже. За главным залом сокровищ исследовательская группа обнаружила следы отдельного, тщательно защищённого внутреннего святилища. Эта меньшая, плотно запечатанная палата явно предназначалась для хранения предметов исключительной редкости — вещей, способных сравниться по цене с целыми королевствами.\n\nТеперь ваши археологи осторожно работают над вскрытием древних печатей, охраняющих эту внутреннюю комнату. Золото уже secured, хранилище открыто, и теперь вы ждёте окончательного отчёта: сохранили ли века безмолвия артефакты внутри... или Рок забрал их, оставив лишь память об их силе?"
  lv_great_project.0006.a:0 "Сокровища Старой Валирии обнаружены!"
