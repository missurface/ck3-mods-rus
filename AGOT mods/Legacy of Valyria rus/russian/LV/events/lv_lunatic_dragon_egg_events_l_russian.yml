l_russian:
decision_cook_dragon_egg.t:0 "Приготовить драконье яйцо"
decision_cook_dragon_egg_desc:0 "Никто ещё не готовил драконье яйцо. Интересно, какое оно на вкус..."
decision_cook_dragon_egg_confirm:0 "Это яйцо будет божественным на вкус!"
decision_cook_dragon_egg_tooltip:0 "Приготовить драконье яйцо и сделать лучший омлет в мире!"

cook_egg_decision_tt:0 "Вы разожжёте огромный костёр, чтобы приготовить яйцо"
character_is_a_lunatic:0 "Вы безумны"
character_has_a_dragon_egg_to_cook:0 "У вас есть [Concept('dragon', 'драконье')|E] яйцо, которое можно приготовить"

lunatic_cook_dragon_egg.001.t:0 "Готовим яйцо!"

lunatic_cook_dragon_egg.001.intro:0 "Ваше драконье яйцо лежит перед вами, словно само напрашивается. Никто ещё не пробовал драконье яйцо. Вы задаётесь вопросом, какое оно на вкус, берёте яйцо и несёте его во двор. Горшок с горячим маслом уже стоит наготове и кипит. Когда вы берёте драконье яйцо в последний раз, в голове вспыхивает мысль:\n\n"
lunatic_cook_dragon_egg.001.gluttonous.desc:0 "Какое оно будет на вкус?"
lunatic_cook_dragon_egg.001.dragonslayer.desc:0 "Я убил дракона, теперь попробую одного на вкус."
lunatic_cook_dragon_egg.001.just_lunatic.desc:0 "Я стану первым, кто попробует драконье яйцо!"
lunatic_cook_dragon_egg.001.end:0 "\n\nНе успеваете вы опустить яйцо в кипящий горшок, как позади раздаётся голос: «[ROOT.Char.GetFirstName], немедленно прекратите! Это [Concept('dragon', 'драконье')|E] яйцо!». Вы оборачиваетесь и видите, как [protesting_courtier.GetFirstName] бросается к вам; в [protesting_courtier.GetHerHisMy] глазах мольба."

lunatic_cook_dragon_egg.001.a:0 "Бросить яйцо в горшок"
lunatic_cook_dragon_egg.001.b:0 "Отойти от горшка"

lunatic_cook_dragon_egg.002.t:0 "Яйцо взрывается!"
lunatic_cook_dragon_egg.002.intro:0 "[protesting_courtier.GetFirstName] в ужасе смотрит, как вы бросаете яйцо в горшок. Кипящее масло будто начинает гореть ещё яростнее, а яйцо трескается. Вы улыбаетесь, предвкушая вкусную трапезу.\n\nНо вместо этого, когда яйцо раскалывается, огромный зелёный огненный шар с невероятной скоростью устремляется прямо на вас..."

lunatic_cook_dragon_egg.0002.a:0 "А-а-а-а!"

mass_coutier_death:0 "Каждый придворный и гость погибает, когда поселение уничтожается"

lunatic_cook_dragon_egg.003.t:0 "Вылупляется дракон"
lunatic_cook_dragon_egg.003.desc:0 "[protesting_courtier.GetFirstName] в ужасе смотрит, как вы бросаете яйцо в горшок. Кипящее масло будто начинает гореть ещё яростнее, а яйцо трескается. Вы улыбаетесь, предвкушая вкусную трапезу. Но затем ваши ожидания рушатся, когда вы замечаете крошечные хлопающие крылья. Дракон появляется на свет!"
lunatic_cook_dragon_egg.0003.a:0 "Моя вкусная трапеза..."

hatched_dragon_via_cooking_notification:0 "[ROOT.Char.GetName] [Select_CString(ROOT.Char.IsFemale, 'вывела', 'вывел' )] [dragon.GetName], пытаясь приготовить [dragon.GetHerHim]!"

lunatic_cook_dragon_egg.0004.t:0 "Яйцо вылупилось!"
lunatic_cook_dragon_egg.0004.desc:0 "Я чувствую себя странно, наблюдая за происходящим. Моё яйцо вылупилось, и дракон выбрался из осколков скорлупы.\n\nЧто вообще на меня нашло, когда я [Select_CString(ROOT.Char.IsFemale, 'захотела', 'захотел' )] убить это великолепное создание? Я уже чувствую подавляющую силу связи между нами и понимаю, что она останется со мной до конца моих дней. Хотя я пока не могу сказать, какого дракон пола, ему всё равно нужно имя, которое история никогда не забудет.\n\nКак мне его назвать?"