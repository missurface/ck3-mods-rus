l_russian:
  agot_EE_reestablish_rhoynar_decision:0 "Объединить ройнаров"
  agot_EE_reestablish_rhoynar_decision_desc:0 "Наследие Ройны стоит на пороге восстановления, объединяя весь ройнарский народ в одну великую империю. От берегов могучей реки до каждого далёкого притока жизнь и процветание расцветут под одним знаменем. Торговцы наполнят водные пути нашей возрождённой империи, растекаясь словно кровь к каждому уголку наших границ. Наш народ теперь будет уверен, что его больше никогда не вынудят уйти в изгнание. Будущее ройнаров начинается здесь — с обещания силы и единства вдоль Матери-Ройны."
  agot_EE_reestablish_rhoynar_decision_confirm:0 "Восстановить ройнарскую империю"
  agot_EE_reestablish_rhoynar_decision_tooltip:0 "Объединить ройнарский народ и вернуть процветание землям вдоль Матери-Ройны"

  agot_EE_rhoynar_restoration.1.t:0 "Ройна восстановлена"
  agot_EE_rhoynar_restoration.1.desc:0 "Сегодня люди по обоим берегам могучей Ройны пробуждаются в преображённом мире. Я [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )] то, чего никто не добивался со времён легенд, — вновь [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] ройнарский народ.\n\nТеперь, когда торговцы идут по Матери-Ройне и её бесчисленным притокам, жизнь и процветание вновь текут к каждому уголку нашей возрождённой империи. Впереди ещё много труда, но одно несомненно: наш народ больше никогда не будет вынужден бежать, как некогда принцесса Нимерия.\n\nБудущее принадлежит нам — здесь, на берегах Ройны."
  agot_EE_rhoynar_restoration.1.a:0 "Мать-Ройна снова улыбается!"