l_russian:
  agot_dragon_personality.0015.warning.desc:0 "Уже несколько недель вы посещаете свою драконью яму, наблюдая за растущими драконами. Всё кажется нормальным. За исключением поведения [growing_dragon.GetFirstName].\n\n"
  agot_dragon_personality.0015.aggressive.desc:0 "Драконьи стражи сообщают о крайней агрессии по отношению к сородичам [growing_dragon.GetFirstName], и в результате другие драконы начали сторониться [growing_dragon.GetHerHim], будто чувствуя опасность или [growing_dragon.Custom('GetDragonHerHis')] агрессию. Во время одной схватки [growing_dragon.GetSheHe] [Select_CString(growing_dragon.IsFemale, 'попыталась', 'попытался' )] разорвать плоть [growing_dragon_victim.GetFirstName].\n\n"
  agot_dragon_personality.0015.voracious.desc:0 "[growing_dragon.GetFirstName] обычно проявляет ненасытный интерес к живому мясу, но в последнее время это, похоже, изменилось: теперь во время кормления [growing_dragon.GetSheHe] смотрит на [growing_dragon_victim.GetFirstName] хищным взглядом.\n\n"
  agot_dragon_personality.0015.voracious_aggressive_bloodthirsty.desc:0 "[growing_dragon.GetFirstName] также обычно проявляет ненасытный интерес к живому мясу, но в последнее время это, похоже, изменилось: теперь во время кормления [growing_dragon.GetSheHe] смотрит на [growing_dragon_victim.GetFirstName] хищным взглядом.\n\n"
  agot_dragon_personality.0015.warning.end:0 "Наблюдая за [growing_dragon.GetFirstName], вы понимаете, что [growing_dragon.GetSheHe] испытывает каннибальские порывы. К счастью, [growing_dragon.GetSheHe] ещё не [Select_CString(growing_dragon.IsFemale, 'питалась', 'питался' )] драконьей плотью, но вы должны вмешаться, изолировать [growing_dragon.GetHerHim] и исправить это поведение."
  agot_dragon_personality.0015.d:0 "Это недопустимо! Я воспитаю этого дракона!"

  agot_dragon_personality.0015.d.f:0 "Вы изолируете [growing_dragon.GetFirstName] от других драконов и начинаете воспитывать [growing_dragon.GetHerHim]"
  agot_dragon_personality.0015.d.success:0 "Ваш дракон больше не каннибал"
  agot_dragon_personality.0015.d.success.tt:0 "Каннибализм исправлен"
  agot_dragon_personality.0015.d.failure:0 "Ваш дракон остаётся каннибалом"
  agot_dragon_personality.0015.d.failure.tt:0 "Не удалось исправить каннибализм"