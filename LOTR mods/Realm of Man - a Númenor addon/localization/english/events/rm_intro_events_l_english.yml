l_english:

 rm_intro.0001.t:0 "The Heir of Westernesse"
 rm_intro.0001.desc:0 "[armenelos|E] City of Kings, seat of the greatest kingdom mankind has ever known. As visitors, merchants, and inhabitants gaze upon its marvels build by rulers past, their millenia old, sturdy foundations are almost enough to let the average man forget about the uncertain future which lies ahead.\n\nIt was only a few decades ago that [GetScriptedCharacterByHistoryID( 'Zigur_x' ).GetFirstNameRegnal] restored the descendants of [GetScriptedCharacterByHistoryID( 'Gimilkhad_1' ).GetFirstNameRegnal], son of [GetScriptedCharacterByHistoryID( 'lineofelros115' ).GetFirstNameRegnal] to their rightful place on the throne by launching a swift and decisive palace coup against the heirs of the usurper [GetScriptedCharacterByHistoryID( 'lineofelros116' ).GetFirstNameRegnal] who murdered his brother and liege in cold blood. By the end of the night, [GetScriptedCharacterByHistoryID( 'lineofelros129' ).GetFirstNameRegnal], last of the false kings lay dead and the blood toll was paid. It was only by a diplomatic masterstroke under the guidance of [GetScriptedCharacterByHistoryID( 'Zigur_1' ).GetFirstNameRegnal], the future queen, that further bloodshed was averted. A compromise was reached between the [faithful|E] and the [kingsmen|E]. House Gimilzôrhîn would be bestowed the crown of [numenor|E], but the line of [GetScriptedCharacterByHistoryID( 'lineofelros116' ).GetFirstNameRegnal] would retain its claim to spiritual leadership.\n\Ever since then, Númenor has enjoyed a time of uneasy peace between the Faithful in the northwest, and the Kingsmen in the southeast. But this status quo is now under threat. Imrazôr, the iron fist that held the realm together for almost half a century is dead and his young, unproven son [GetScriptedCharacterByHistoryID( 'Zigur_3' ).GetFirstNameRegnal] now sits upon the throne of a deeply divided nation whose people still remember the days when a different banner flew over [GetTitleByKey('c_armenelos').GetNameNoTier]. Only time will tell if Adûnakhôr has the cunning and strength required to lead, or if his father's violent legacy and his own inexperience will be his undoing."
 rm_intro.0001.a:0 "I am not my father, for better or for worse..."
 rm_intro.0001.a.tt:0 "Our fates are bound to change." 

 rm_intro.0002.t:0 "An Old Man's Legacy"
 rm_intro.0002.desc:0 "It still feels like it was yesterday that my father [GetScriptedCharacterByHistoryID( 'Gimilkhad_1' ).GetFirstNameRegnal] first told me of the humiliation our house suffered. Stripped of our birthright, the sons of [GetScriptedCharacterByHistoryID( 'lineofelros115' ).GetFirstNameRegnal] were forced to carve out an existence for themselves as wanderers and merchenaries. But we have never forgotten the wrongs of the past.\nI have dedicated my life to reclaiming what is rightfully ours, but alas, I failed. The years have broken my body and I fear the time yet remaining to me is short. Soon, the hope of our line will rest on the shoulders of my young son [GetScriptedCharacterByHistoryID( 'Zigur_x' ).GetFirstNameRegnal]. He is quick witted and hale, but has much to yet learn. But if he does listen, if he becomes the man I know he can be, he might yet succeed where I have failed and raise the [GetDynastyHouseByID('rm_house_zigur').GetName] banner above [armenelos|E]."
 rm_intro.0002.a:0 "I only hope I have enough time left to teach him..."

 #Balkazîr Overrides

 numenor.0003.t1:0 "The King who Never was"
 numenor.0003.desc1:0 "I am at a crossroads, ever since [GetScriptedCharacterByHistoryID( 'Zigur_x' ).GetFirstNameRegnal] stripped my family of its birthright, we have ben forced to accept the shaky compromise put forward by the witch [GetScriptedCharacterByHistoryID( 'Zigur_1' ).GetFirstNameRegnal]. House [GetDynastyHouseByID('rm_house_zigur').GetName] would inherit the crown of [numenor|E] while house [GetDynastyHouseByID('rm_house_inziladun').GetName] would retain spiritual leadership.\nSo far there was no way for me to successfully challenge this unjust status quo, but times have changed. Imrazôr the tyrant is dead and his son [GetScriptedCharacterByHistoryID( 'Zigur_3' ).GetFirstNameRegnal] is young and inexperienced. He may yet see the light and return Númenor to the righeous path of but if he does not, something must be done. We cannot allow the [kingsmen|E] menace to corrupt our nation once again."
 numenor.0003.a1:0 "I will save Númenor one way or the other."
 numenor.0003.a.tt1:0 "There may yet be hope for the [faithful|E]."   

 