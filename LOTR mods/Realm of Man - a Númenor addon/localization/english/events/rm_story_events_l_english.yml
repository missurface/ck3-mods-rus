l_english:
 
 rm_adunaphel_story_event.0017.t:0 "The Dowager Queen"
 rm_adunaphel_story_event.0017.desc:0 "My mother Dowager Queen [GetScriptedCharacterByHistoryID( 'Zigur_1' ).GetFirstNameRegnal] is a mystery, not just to me, but to everyone. Although the realm owes her a great debt for negotiating the status quo agreement between [kingsmen|E] and [faithful|E] to secure my father's reign, her origins are unknown to anyone.\nAll I know is what little my father told me. He met her before he started the reclamation of our house's rightful throne. From what I could discern, she was very much the driving force behind my father's ambition. Although I was always closer to my father than to my mother, he never liked to talk about the past, except for when it concerned our illustrious ancestry.\nNot that I would have cared much for it anyway. For most of my life, my mother has never shown much intresst in me either, instead concerning herself with her schemes and machinations. Behind closed doors, the court wispers of witchcaft, obscure rituals, and conspiratory meetings under the cover of darkness.\n\nAs if all this were not concerning enough, in the past few months since my father's death, my mother seems to have taken a renewed interest in me.Whether it is during council meetings or while holding court, I can feel her gaze upon me, and within her deep green eyes there seems to be a certain possessivness, a certain...hunger."
 rm_adunaphel_story_event.0017.a:0 "I do not trust her, no sane man would"

 rm_adunaphel_story_event.0001.t:0 "A Dark Night"
 rm_adunaphel_story_event.0001.desc:0 "The last few months have been rather stressful. The consolidation of my rule has demanded much of me and costed many a night's sleep. Tonight is no different, I have set at my desk too long, pondering over maps and documents. As I finally decide to go to sleep, I spy a figure at the other end of the corridor.\nIt is my mother [GetScriptedCharacterByHistoryID( 'Zigur_1' ).GetFirstNameRegnal]. Although I have already been informed of her nightly strolls, nobody was ever able to tell me where she went at such a late hour. As I stand there wondering I see her glance at me, briefly but sharply. Does she want me to follow her?"
 rm_adunaphel_story_event.0001.a:0 "Very well, I am intrigued"
 rm_adunaphel_story_event.0001.a.tt:0 "The Adûnaphêl storyline will commence"
 rm_adunaphel_story_event.0001.b:0 "Her foul machinations are her own, I want nothing to do with it."
 rm_adunaphel_story_event.0001.b.tt:0 "The Adûnaphêl storyline will be skipped and the game will continue normally"

 rm_adunaphel_story_event.0002.t:0 "A Tale of Two Siblings"
 rm_adunaphel_story_event.0002.desc:0 "After what felt like an eternity, my mother leads my to a part of the palace I never knew even existed. This place looks old, very old. Definetly from before the [downfall|E], maybe even from before the reign of [GetScriptedCharacterByHistoryID( 'lineofelros28' ).GetFirstNameRegnal]. As I wonder over these things, my mother's voice snaps me out of my thoughts:\n\n#italic "Welcome my son, to the place were everything began. Long ago, in these very chambers, I embraced the man I loved more than anything else in the world. My beloved [GetScriptedCharacterByHistoryID( 'Erakhor' ).GetFirstNameRegnal], firstborn son of Tar-[GetScriptedCharacterByHistoryID( 'lineofelros20' ).GetFirstNameRegnal] of [anadune|E].#!"\n\nHer words make my mind race: "#italic Tar-Ardamin?! Surely, you jest mother. That was over three millenia ago! And besides, I have never heard of a prince 'Êrakhôr' before. This name is never mentioned in the ancient Scroll of Kings or any of the histories.#!"\n\nAs she lights a dusty old candle, I can see the edges of her mouth form into a soft smile: "#italic "Patience my dear, everything will be revealed in due time. But yes, no one today remembers the name of my beloved. My accursed father would have done everything in his power and more to erase the 'shame' of his house."#!"\n\nThose last words strike me like lightning: "#italic "Whait, your...brother?! He...#!"\n\n"#italic Yes!"#! She cuts me off: "#italic Êrakhôr, the man I loved, was my dear older brother. I #bold loved #!him, more than any mere sister could! Our love was a pure one, unbound by the shackles of [avaloigods|E] tyranny.#!\n\nShe pauses briefly, those memories seem to cause her great pain: #italic "When our father found out, he sought to have us put to death for committing a 'mortal sin', pah! That cynical old bastard only ever cared about his own reputation! The night we attempted to flee, we were betrayed! My beloved brother was disinherited and executed for treason. The only reason I myself escaped my father's wrath was because of my...special abilities.""
 rm_adunaphel_story_event.0002.a:0 "#italic "My God!#!""

 rm_adunaphel_story_event.0018.t:0 "Bonds of Blood"
 rm_adunaphel_story_event.0018.desc:0 "She grabs the candleholder thighter as her hands begin to shake: #italic "I swore to dedicate the rest of my life to avenging my beloved. No matter the cost, no matter how long it would take. I spent centuries studying the mysteries of this world, refusing to die until my work was done.#!"\n\nHer words confirm my worst fears: #italic "Does that mean, my father was just one of your pawns?"#!\n\nMy question seems to delight her, as it brings a warm, almost motherly smile to her face: #italic "Indeed my dear. Your father's coup, the [faithful|E] the status quo, all this was part of my plans. I had planned to use you as my puppet as well, but...#!"\n\nA dreadful hunger starts to fill her eyes as she takes a step towards me: #italic "You are #bold so much#! like #bold him#!. Everything about you reminds me of my beloved [GetScriptedCharacterByHistoryID( 'Erakhor' ).GetFirstNameRegnal]. You even look more and more like him with each passing year."#!\n\nShe takes another step towards me and an uncanny smile forms on her lips as her eyes gleam with wild manic obsession: #italic "I haven't felt like this in millenia, this must be fate!"#!\n\nI stand frozen in terror while she takes my face between her hands: #italic "You have felt it too, haven't you? All these years of your life longing for your mother's sweet embrace. It's a shame I didn't realise it soonerb but I'm here now darling. And what I can offer you is far more than just my love, far more than any mere mortal could offer.#!\n\nHer wild gaze pierces right through my soul as her burning desire threatens to overwelm me: #italic "I have sundered the gates of death itself, my knowledge exceeds even the wisest among the great [istariconcept|E]. Riches beyond imagining, endless power, even immortality itself, all this can be yours if only you will love me...#!""
 rm_adunaphel_story_event.0018.a:0 "#italic "I..."#!"
 rm_adunaphel_story_event.0018.a.tt:0 "#X This marks a point of no return!#!"
 rm_adunaphel_story_event.0018.b:0 "#italic "Your madness ends here witch!"#!"
 rm_adunaphel_story_event.0018.b.tt:0 "The Adûnaphêl storyline will end"

 rm_adunaphel_story_event.0016.t:0 "An End to the Madness"
 rm_adunaphel_story_event.0016.desc:0 "I always knew my mother was strange but never in my darkest nightmares would I have imagined something like this. Someone with a weaker will might have fallen for her fiendish allure, but I am not so easily swayed.\nWith my mother's sinister plots averted the realm might enjoy stability for yet another generation. I have not yet decided what to do with her, a part of me still hopes that she can be redeemed, but I should not end up making a bigger fool out of myself than my father did by trusting her."
 rm_adunaphel_story_event.0016.a:0 "Time will tell"

 rm_adunaphel_story_event.0003.t:0 "An Ancient Promise"
 rm_adunaphel_story_event.0003.desc:0 "Before I get a chance to speak, she curls around my neck like a venomous viper: #italic "My darling, let us bind our blood. Let our line be as pure as our love!#!"\n\nHer lips touch mine, I feel her power overwelm me. Spreading through me like fire, burning away my doubts and fears. I can see it now, [mulkhercharacter|E], the [avaloigods|E], decievers all of them! The only thing in this world worthy of worship is our sacred lineage. For does its power not confirm the inherent superiority of the [adunai|E]? Chosen by [erutheone|E] all of [middleearth|E] is ours to claim and rule as we see fit.\n\nAs our lips part, I feel some of her power lingering within me. Our eyes meet again and a triumphant smile lights her face: #italic "Now then my beloved, eternity awaits! Let us make this sacred homeland of ours a place where our love is worshiped, not frowned upon."#!\n\nYes! I shall avenge the injustice done to my dear mother. The [faithful|E] blight will be wiped out and our beloved [anadune|E] purified of all false gods!"
 rm_adunaphel_story_event.0003.a:0 "#italic "Yes Mother..."#!"
 rm_adunaphel_story_event.0003.a.tt:0 "Embrace the Schizo!"

 rm_adunaphel_story_event.0014.t:0 "The Future of [numenor|E]"
 rm_adunaphel_story_event.0014.desc:0 "Over the past few weeks, my mother has been working on securing future alliances for the inevitable clash with the fools who call themselvesd the '[faithful|E]'. Some of our old allies may yet see the righteousness of our cause, but the [adunai|E] are slow to change their ways. But their ancient pride runs deep and many might even welcome this new age of purity and consanguinity.\n\nAfter all, the path of [GetFaithByKey('faith_katharad').GetName] iss one of total freedom. No more [avaloigods|E], no more [maiargods|E] or [istariconcept|E] to blind us. Only our glorious destiny bestowd upon us by our revered ancestors and by [erutheone|E] true God of humanity."
 rm_adunaphel_story_event.0014.a:0 "Submission is in ther own interest"
 rm_adunaphel_story_event.0014.a.tt:0 "Although you will find #italic some#! support among the most radical of the [kingsmen|E], most of Númenor will not be pleased by your newfound zeal."

 rm_adunaphel_story_event.0015.t:0 "A Meager Reception"
 rm_adunaphel_story_event.0015.desc:0 "The reception to my proclamation of the [GetFaithByKey('faith_katharad').GetName], was reserved to say the least. Even among the [kingsmen|E] there were many who accused me of disregarding millenia old tradition and precedent in favour of ideological dogma, some even called me a 'dangerous radical'.\nAlas, I am not without allies. Some of the more opportunistic lords have agreed to follow my lead and embrace the new faith, chief among them [GetScriptedCharacterByHistoryID( 'lineofvardur53' ).GetFirstNameRegnal] of the [GetDynastyHouseByID('house_vardurionath').GetName]. Their support will no doubt prove most valueable, for the situation still is precarious.\nWhile most of the King's Men have at least headed my call, most of the [faithful|E] did not even bother to attend. Instead, concerning rumours have reached me from the northwest. It seems there has been a secret meeting between prominent Faithful leaders in [GetTitleByKey('c_andunie').GetName], chief among them [GetScriptedCharacterByHistoryID( 'lineofelatan55' ).GetFirstNameRegnal].\nAlthough the exact contents of the meeting are not known to me, its timing leaves little to the imagination. The Faithful have made their move and all of [anadune|E] will soon suffer the consequences of what is to come."
 rm_adunaphel_story_event.0015.a:0 "A storm is coming..."

 rm_adunaphel_story_event.0004.t:0 "War for [westernesse|E]"
 rm_adunaphel_story_event.0004.desc:0 "Earlier today, a messenger arrived from [GetTitleByKey('c_andunie').GetName], carrying a letter written by [GetScriptedCharacterByHistoryID( 'lineofelatan55' ).GetFirstNameRegnal] himself:\n\n#italic "To the treacherous heathen [GetScriptedCharacterByHistoryID( 'Zigur_3' ).GetFirstNameRegnal], who calls himself king. Me and mine own will not allow you to drag our beloved homeland back into darkness. This madness must end here and now! Abdicate and we will allow you the dignity of exile, refuse and you leave us no choice but to take up arms against your tyrannical cult."#!\n\nIt goes without saying that this is treason of the highest magnitude and leaves me with no choice but to declare war. Our political situation might be less than ideal, but our convictions are strong, our hearts are hardened, and with the blessing of our exhalted ancestors we shall prevail! May [erutheone|E] judge us worthy to serve under his eye, to war!"
 rm_adunaphel_story_event.0004.a:0 "I will water the ground with [faithful|E] blood!"

 rm_adunaphel_story_event.0012.t:0 "Victory"
 rm_adunaphel_story_event.0012.desc:0 "Against all odds, we have prevailed. Our enemies lie battered and broken, with this victory the [GetFaithByKey('faith_katharad').GetName] have secured their control over [anadune|E] for generations to come. Isolated [faithful|E] resistance is likely to continue for some time, but their leadership has been firmly crushed.\nAs their leaders are now at my mercy it falls upon me to pass judgement. Although the only just punishment for treason is death, it may be beneficial to allow some of them to live, as they could be useful allies in my reclamation of [middleearth|E].\n\nOne thing is certain though, with this victory I have already exceeded my father's legacy. For the first time in centuries, Anadûnê is truly united in faith and conviction. The Faithful stain which humiliated my beloved mother and scorned her legacy has been whiped out. Now, I may focus on fulfilling our nation's true destiny Middle-earth awaits!"
 rm_adunaphel_story_event.0012.a: "Nothing can stop us now!"

 rm_adunaphel_story_event.0013.t:0 "[faithful|E] Restoration"
 rm_adunaphel_story_event.0013.desc:0 "The darkness has been whiped out. Numenor may once again prosper under the rule of [GetScriptedCharacterByHistoryID( 'lineofelros1' ).GetFirstNameRegnal]' true heir, [GetScriptedCharacterByHistoryID( 'lineofelros133' ).GetFirstNameRegnal]! May this war serve as a grim reminder to all of us that the Darkness never sleeps and therefore we must remain vigilant at all times. We can no longer allow ourselves to remain isolated on our island. We must carry the fight to the lair of evil itself and cleanse [middleearth|E] once and for all!"
 rm_adunaphel_story_event.0013.a:0 "The final battle awaits!"