zayanmagani_gloss: "[adunaic_short|E] #bold Zâyanmagânî#! means 'Land-builder' - specifically a feminine form of masc. Zâyanmagân."
raza_n_sapthan_gloss: "[adunaic_short|E] #bold Razâ ’nSapthân#! means 'Mercy of the Wise'."
tarik_n_katharad_gloss: "[adunaic_short|E] #bold Târik ’nKatharâd#! means 'Pillar of Eternal Life'."

