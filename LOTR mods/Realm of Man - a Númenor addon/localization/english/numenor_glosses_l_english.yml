### Quenya ###
andoralcar_gloss: "[quenya_short|E] #bold Andoralcar#! means 'Andor Glory', where Andor refers to the Land of Gift, or Númenor."
hyarmenion_gloss: "[quenya_short|E] #bold Hyarmenion#! means 'Son of the South'."
lintamacil_gloss: "[quenya_short|E] #bold Lintamacil#! means 'Swift-sword'."
londe_ancalimonva_gloss: "[quenya_short|E] #bold Londë Ancalimonva#! means 'Ancalimon's Haven'."
nucuptar_gloss: "[quenya_short|E] #bold Nucuptar#! means 'Humbler' or 'Vanquisher'."

### Sindarin ###

niben_aranruth_gloss: "[sindarin_short|E] #bold Niben Aranrúth#! means 'Little King's-Ire', and is the blade of the Kings of Númenor, created after its predecessor was lost to [pharazon|E]'s failed armada."

