 tenet_adunaic_mission_name:0 "Mission of the Adûnâi"
 tenet_adunaic_mission_desc:0 "The Adûnâi, mightiest and noblest of all men were bestowed with a sacred errand. All across Middle Earth the taint of the Dark Lord's shadow has spread, and it is our duty to cleanse it off this filth. By the rigeous fury of our swords Sauron and his minions shall be vanquished. Under our rule, Arda shall once again be made pure and prosperous."

